apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: cad-kafka
  namespace: default
spec:
  kafka:
    version: 3.6.0
    replicas: 1
    metadataVersion: "3.6-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}